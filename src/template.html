<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>window.GAUGES_NO_AUTO_INIT = true</script>
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <div class="application-toolbar">
        <div class="application-logo" role="img" aria-label="EFIGenie"></div>
        <div class="file-menu">
          <input id="btnFile" type="button" class="w3-button w3-padding-16" value="File">
        </div>
        <input id="btnBurn" type="button" class="w3-button w3-padding-16" value="Burn">
        <input id="btnLoad" type="file" style="display: none;">
        <input id="btnConnect" type="button" class="w3-button w3-padding-16" value="Connect">
        <input id="btnOpenLog" type="file" style="display: none;">
        <span id="target"></span>
    </div>
    <div id="overlay"></div>
    <div><div id="workspace" style="position: static; margin: 0; padding: 0;"></div></div>
    <script>
      var siteWidth = 750
      var scale = screen.width /siteWidth

      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width='+siteWidth+', initial-scale='+scale+'')
  </script>
  </body>
</html>
